<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="auto">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Claude Code 配色: .claude is the brand accent, .shimmer the lighter
       highlight the working line sweeps across the verb, .tool the tool-block
       pink. -->
  <style>
    .term { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title-text { font-size: 13px; fill: #808080; font-weight: 500; }
    .user-sym { font-size: 13px; fill: #f59575; font-weight: bold; }
    .user-text { font-size: 13px; fill: #dedede; }
    .think-text { font-size: 13px; fill: #808080; }
    .asst-sym { font-size: 13px; fill: #666666; }
    .asst-text { font-size: 13px; fill: #dedede; }
    .tool-icon { font-size: 13px; fill: #4eba65; }
    .tool-name { font-size: 13px; fill: #fd5db1; font-weight: bold; }
    .tool-meta { font-size: 13px; fill: #808080; }
    .tool-gut { font-size: 13px; fill: #808080; }
    .tool-pass { font-size: 13px; fill: #dedede; }
    .rule { stroke: #4d4d4d; stroke-width: 1; }
    .prompt-sym { font-size: 13px; fill: #d77757; font-weight: bold; }
    .prompt-text { font-size: 13px; fill: #dedede; }
    .status-text { font-size: 12px; fill: #808080; }
    .todo-head { font-size: 12px; fill: #808080; font-weight: bold; }
    .todo-done { font-size: 13px; fill: #4eba65; }
    .todo-open { font-size: 13px; fill: #808080; }
    .todo-doing { font-size: 13px; fill: #d7a657; }
    .todo-text { font-size: 13px; fill: #dedede; }
    .working-sym { font-size: 13px; fill: #d77757; font-weight: bold; }
    .working-dim { font-size: 13px; fill: #8a5540; }
    .working-hot { font-size: 13px; fill: #f59575; font-weight: bold; }
    .working-meta { font-size: 13px; fill: #d77757; }
  </style>

  <!-- Terminal Window Background with Shadow -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="900" height="480" rx="10" fill="#1a1a1a" stroke="#4d4d4d" stroke-width="1.2"/>
  </g>

  <!-- Window Title Bar -->
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text class="term title-text" x="460" y="35" text-anchor="middle">jitianyu@linux: ~/workspace — ux-agent (92×24)</text>

  <!-- Terminal Body Content (Faithful Bubble Tea v2 Layout) -->
  <g class="term">
    <!-- User Message: ❯ prompt at column 0, no box -->
    <text class="user-sym" x="36" y="74">❯</text>
    <text class="user-text" x="52" y="74">请用 Go 语言实现一个原子文件写入器，附带测试并使用 go test 验证。</text>

    <!-- Assistant turn opens with a ⏺ bullet at column 0 -->
    <text class="asst-sym" x="36" y="104">⏺</text>
    <text class="asst-text" x="52" y="104">我先写 writer，然后跑包测试。</text>

    <!-- Read-only tools group into one gerund row while they run -->
    <text class="tool-icon" x="36" y="134"> ✓</text>
    <text class="tool-meta" x="56" y="134">读取 2 个文件，搜索 1 个模式</text>

    <!-- Tool call in Claude Code grammar: ⏺ Name(arg) with a ⎿ result subtree -->
    <text class="tool-icon" x="36" y="164"> ✓</text>
    <text class="tool-name" x="56" y="164">Bash</text>
    <text class="tool-meta" x="90" y="164">(go test -v ./internal/tools)</text>
    <text class="tool-meta" x="316" y="164"> · 24ms</text>

    <text class="tool-gut" x="50" y="186">⎿  </text>
    <text class="tool-pass" x="80" y="186">ok  internal/tools  0.42s</text>
    <text class="tool-meta" x="266" y="186"> (ctrl+o to expand)</text>

    <text class="asst-sym" x="36" y="216">⏺</text>
    <text class="asst-text" x="52" y="216">测试通过。写入是临时文件 + fsync + rename。</text>

    <!-- Task list: above the composer, where Claude Code keeps it -->
    <text class="todo-head" x="36" y="300"> 待办 1/3</text>
    <text class="todo-done" x="50" y="322">✓</text>
    <text class="todo-text" x="68" y="322">编写原子写入器</text>
    <text class="todo-doing" x="50" y="344">▸</text>
    <text class="todo-text" x="68" y="344">运行包测试</text>
    <text class="todo-open" x="50" y="366">◻</text>
    <text class="todo-text" x="68" y="366">补充崩溃恢复测试</text>

    <!-- Working line: transcript tail, just above the input. The highlight is
         mid-sweep across the verb, which is why the two halves differ. -->
    <text class="working-sym" x="36" y="394">✻</text>
    <text class="working-dim" x="52" y="394">Her</text>
    <text class="working-hot" x="76" y="394">di</text>
    <text class="working-dim" x="92" y="394">ng…</text>
    <text class="working-meta" x="130" y="394"> (8m 39s · ↓ 834 tokens · thinking)</text>

    <!-- Composer: the only ruled element -->
    <line class="rule" x1="36" y1="412" x2="884" y2="412"/>
    <text class="prompt-sym" x="36" y="438">❯</text>
    <text class="prompt-text" x="52" y="438">重构缓存键序列化算法，引入 xxhash64 哈希加速</text>
    <!-- Cursor -->
    <rect x="424" y="425" width="8" height="17" fill="#d77757" opacity="0.85"/>
    <line class="rule" x1="36" y1="462" x2="884" y2="462"/>

    <!-- Status Line (single dim row): the working pill is gone, only the
         interrupt hint remains, right-aligned. -->
    <text class="status-text" x="36" y="484"> step-3.7-flash · ~/workspace · 14% ctx · ⏵⏵ auto-edit</text>
    <text class="status-text" x="884" y="484" text-anchor="end">esc 中断</text>
  </g>
</svg>
