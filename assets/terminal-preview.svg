<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#13141c"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .code { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .text-title { font-size: 13px; fill: #7a889b; font-weight: 500; }
    .text-dim { font-size: 13px; fill: #565f89; }
    .text-norm { font-size: 13px; fill: #c0caf5; }
    .text-user-hdr { font-size: 13px; fill: #7aa2f7; font-weight: bold; }
    .text-assistant-hdr { font-size: 13px; fill: #9ece6a; font-weight: bold; }
    .text-think-hdr { font-size: 12px; fill: #2ac3de; font-weight: 600; }
    .text-think-body { font-size: 12px; fill: #7982a9; font-style: italic; }
    .text-tool-hdr { font-size: 13px; fill: #e0af68; font-weight: 600; }
    .text-tool-out { font-size: 12px; fill: #8994b6; }
    .text-pass { font-size: 12px; fill: #9ece6a; font-weight: bold; }
    .text-highlight { font-size: 12px; fill: #73daca; }
    .text-prompt-sym { font-size: 15px; fill: #bb9af7; font-weight: bold; }
    .text-prompt-msg { font-size: 13px; fill: #e0af68; }
    .pill-txt { font-size: 11px; font-weight: 600; }
  </style>

  <!-- Window Container with drop shadow -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="900" height="520" rx="14" fill="url(#bgGrad)" stroke="#2b2e44" stroke-width="1.5"/>
  </g>

  <!-- Title Bar -->
  <path d="M 10 24 A 14 14 0 0 1 24 10 L 896 10 A 14 14 0 0 1 910 24 L 910 52 L 10 52 Z" fill="url(#headerGrad)"/>
  <line x1="10" y1="52" x2="910" y2="52" stroke="#2b2e44" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="34" cy="31" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="56" cy="31" r="6.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="78" cy="31" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Title & Environment -->
  <text class="code text-title" x="460" y="36" text-anchor="middle">ux-agent — ViudiraTech/Uinxed-Agent — 92×26</text>
  <rect x="760" y="21" width="134" height="20" rx="4" fill="#24283b"/>
  <text class="code pill-txt" x="827" y="35" text-anchor="middle" fill="#7aa2f7">Go 1.25 · Bubble Tea v2</text>

  <!-- Terminal Content Area -->
  <g class="code" transform="translate(10, 0)">
    <!-- Turn 1: User Request -->
    <text class="text-user-hdr" x="30" y="84">❯ user</text>
    <text class="text-norm" x="46" y="107">Implement an atomic file writer in Go with tests and verify with go test.</text>

    <!-- Turn 2: Assistant Output -->
    <text class="text-assistant-hdr" x="30" y="142">⏺ assistant</text>

    <!-- Reasoning Box (Thinking collapsible) -->
    <g transform="translate(46, 154)">
      <rect x="0" y="0" width="810" height="50" rx="6" fill="#1a1c29" stroke="#2ac3de" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#2ac3de"/>
      <text class="text-think-hdr" x="28" y="22">Thinking (1.4s) · Press Ctrl+T to expand / collapse</text>
      <text class="text-think-body" x="28" y="40">Planning atomic temp-file rename semantics, drafting unit tests, checking race condition behavior...</text>
    </g>

    <!-- Tool Execution Box -->
    <g transform="translate(46, 216)">
      <rect x="0" y="0" width="810" height="106" rx="6" fill="#13141f" stroke="#414868" stroke-width="1"/>
      <!-- Tool header -->
      <circle cx="16" cy="20" r="4" fill="#e0af68"/>
      <text class="text-tool-hdr" x="28" y="24">Running tool: bash "go test -v ./internal/tools"</text>
      <!-- Tool output lines -->
      <text class="text-tool-out" x="28" y="48">⎿ === RUN   TestAtomicFileWriter</text>
      <text class="text-tool-out" x="48" y="68">--- </text>
      <text class="text-pass" x="78" y="68">PASS:</text>
      <text class="text-tool-out" x="120" y="68">TestAtomicFileWriter (0.02s)</text>
      <text class="text-pass" x="28" y="90">PASS</text>
      <text class="text-highlight" x="78" y="90">ok  github.com/ViudiraTech/Uinxed-Agent/internal/tools  0.024s</text>
    </g>

    <!-- Assistant Summary Line -->
    <text class="text-norm" x="46" y="348">All tests passed cleanly! The implementation ensures atomic writes and crash safety.</text>

    <!-- Bottom Composer / Input Bar -->
    <g transform="translate(26, 376)">
      <rect x="0" y="0" width="848" height="46" rx="8" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5"/>
      <text class="text-prompt-sym" x="16" y="29">❯</text>
      <text class="text-prompt-msg" x="36" y="28">Refactor cache key serialization to use xxhash64</text>
      <!-- Blinking Cursor -->
      <rect x="424" y="14" width="8" height="20" rx="1" fill="#7aa2f7" opacity="0.85"/>
      <!-- Helper Shortcuts on right -->
      <text class="text-dim" x="832" y="28" text-anchor="end">/ commands · @ subagents · ? help</text>
    </g>

    <!-- Status Bar / Pills -->
    <g transform="translate(26, 434)">
      <rect x="0" y="0" width="848" height="38" rx="6" fill="#161720" stroke="#2b2e44" stroke-width="1"/>

      <!-- Pill 1: Model -->
      <rect x="12" y="8" width="134" height="22" rx="4" fill="#24283b"/>
      <text class="pill-txt" x="79" y="23" text-anchor="middle" fill="#7aa2f7">󰘧 step-3.7-flash</text>

      <!-- Pill 2: Workspace -->
      <rect x="154" y="8" width="128" height="22" rx="4" fill="#23263b"/>
      <text class="pill-txt" x="218" y="23" text-anchor="middle" fill="#bb9af7">📁 ~/workspace</text>

      <!-- Pill 3: Storage -->
      <rect x="290" y="8" width="112" height="22" rx="4" fill="#22273e"/>
      <text class="pill-txt" x="346" y="23" text-anchor="middle" fill="#7dcfff">💾 sqlite-wal</text>

      <!-- Pill 4: Effort -->
      <rect x="410" y="8" width="118" height="22" rx="4" fill="#362c1d"/>
      <text class="pill-txt" x="469" y="23" text-anchor="middle" fill="#ff9e64">⚡ supercode</text>

      <!-- Pill 5: Agent Mode -->
      <rect x="536" y="8" width="94" height="22" rx="4" fill="#1b2f38"/>
      <text class="pill-txt" x="583" y="23" text-anchor="middle" fill="#2ac3de">🤖 build</text>

      <!-- Pill 6: Status -->
      <rect x="754" y="8" width="82" height="22" rx="4" fill="#173428"/>
      <text class="pill-txt" x="795" y="23" text-anchor="middle" fill="#9ece6a">󰄴 Ready</text>
    </g>
  </g>
</svg>
