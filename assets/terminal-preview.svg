<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="auto">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .term { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title-text { font-size: 13px; fill: #565f89; font-weight: 500; }
    .user-sym { font-size: 13px; fill: #7aa2f7; font-weight: bold; }
    .user-text { font-size: 13px; fill: #c0caf5; }
    .think-text { font-size: 13px; fill: #565f89; }
    .asst-sym { font-size: 13px; fill: #3b4261; }
    .asst-text { font-size: 13px; fill: #c0caf5; }
    .tool-icon { font-size: 13px; fill: #9ece6a; }
    .tool-name { font-size: 13px; fill: #bb9af7; }
    .tool-meta { font-size: 13px; fill: #565f89; }
    .tool-gut { font-size: 13px; fill: #565f89; }
    .tool-pass { font-size: 13px; fill: #9ece6a; }
    .rule { stroke: #292e42; stroke-width: 1; }
    .prompt-sym { font-size: 13px; fill: #7aa2f7; font-weight: bold; }
    .prompt-text { font-size: 13px; fill: #c0caf5; }
    .status-text { font-size: 12px; fill: #565f89; }
    .status-busy { font-size: 12px; fill: #e0af68; }
  </style>

  <!-- Terminal Window Background with Shadow -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="900" height="480" rx="10" fill="#1a1b26" stroke="#292e42" stroke-width="1.2"/>
  </g>

  <!-- Window Title Bar -->
  <circle cx="34" cy="30" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text class="term title-text" x="460" y="35" text-anchor="middle">jitianyu@linux: ~/workspace — ux-agent (92×24)</text>

  <!-- Terminal Body Content (Faithful Bubble Tea v2 Layout) -->
  <g class="term">
    <!-- User Message -->
    <text class="user-sym" x="36" y="74">❯</text>
    <text class="user-text" x="52" y="74">Implement an atomic file writer in Go with tests and verify with go test.</text>

    <!-- Assistant Reasoning (Expanded Thinking) -->
    <text class="think-text" x="36" y="112">  ✻ Thinking (ctrl+t to collapse)</text>
    <text class="think-text" x="36" y="134">    Planning atomic temp-file write &amp; rename semantics to prevent corruption...</text>
    <text class="think-text" x="36" y="156">    Drafting unit tests with concurrent goroutines to verify race safety.</text>

    <!-- Assistant Response Stream -->
    <text class="asst-sym" x="36" y="190">⏺</text>
    <text class="asst-text" x="52" y="190">I have created internal/tools/writer.go with atomic rename semantics. Running tests:</text>

    <!-- Tool Call Execution -->
    <text class="tool-icon" x="36" y="224"> ✓</text>
    <text class="tool-name" x="56" y="224">bash("go test -v ./internal/tools")</text>
    <text class="tool-meta" x="300" y="224"> · done · 24ms</text>

    <!-- Tool Call Result Output -->
    <text class="tool-gut" x="36" y="246">   ⎿  </text>
    <text class="tool-pass" x="72" y="246">PASS: TestAtomicFileWriter (0.02s) · PASS</text>

    <!-- Assistant Response Conclusion -->
    <text class="asst-text" x="36" y="286">  All unit tests passed cleanly! The implementation ensures atomic writes and crash resilience.</text>

    <!-- Composer: The Only Bordered Element in Real TUI -->
    <line class="rule" x1="36" y1="360" x2="884" y2="360"/>
    <text class="prompt-sym" x="36" y="386">❯</text>
    <text class="prompt-text" x="52" y="386">Refactor cache key serialization to use xxhash64</text>
    <!-- Cursor -->
    <rect x="424" y="373" width="8" height="17" fill="#7aa2f7" opacity="0.85"/>
    <line class="rule" x1="36" y1="412" x2="884" y2="412"/>

    <!-- Status Line (Single dim row at bottom) -->
    <text class="status-text" x="36" y="458"> step-3.7-flash · ~/workspace · 14% ctx · build · router · effort high</text>
    <text class="status-busy" x="884" y="458" text-anchor="end">⠋ Working 1.4s · esc to interrupt</text>
  </g>
</svg>
