name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: true}
      - name: Download modules
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...
  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: true}
      - name: Download modules
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          name="ux-agent-${GOOS}-${GOARCH}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${version} -X main.commit=${commit} -X main.buildDate=${build_date}"
          go build -trimpath -ldflags="$ldflags" -o "dist/${name}${ext}" ./cmd/ux-agent
          cd dist
          if [ "$GOOS" = windows ]; then zip "${name}.zip" "${name}${ext}"; rm "${name}${ext}"; else tar -czf "${name}.tar.gz" "${name}${ext}"; rm "${name}${ext}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ux-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: Checksums
        shell: bash
        run: (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
          fi
